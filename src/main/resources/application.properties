# Настройки JPA.
#
# ВНИМАНИЕ. Ключи вида spring.jpa.hibernate.ddl-auto здесь инертны: Spring Boot
# в проекте не запускается (ADR-0001), контекст поднимается вручную через
# AnnotationConfigApplicationContext, и Boot-свойства не читаются. До задачи
# #236 Hibernate в проекте не было вовсе, и эта настройка была мёртвой.
#
# Реальный режим схемы задан жёстко в SpringConfig.entityManagerFactory:
# hibernate.hbm2ddl.auto = none. Hibernate не имеет права менять схему —
# она создана им же и содержит 807 тысяч кадров. Значение update ниже
# оставлено закомментированным: если его кто-то раскомментирует, на
# не-Boot-контексте это ничего не изменит, но будет читаться как
# разрешение на изменение схемы, которого нет.
#
# spring.jpa.hibernate.ddl-auto=update
